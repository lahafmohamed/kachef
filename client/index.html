<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout use env(safe-area-inset-*) on notched phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Gestion de groupe scout : membres, matalib, présences et promotions." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f7f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101214" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kachef" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Kachef Alghadir</title>
    <style>
      /* Paint the app background before the CSS bundle lands, so a cold start
         on mobile doesn't flash white (or flash white in dark mode). */
      html { background: #f8f7f4; }
      @media (prefers-color-scheme: dark) {
        html { background: #101214; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
